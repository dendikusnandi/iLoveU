version: '3.8'

services:
  vpn-api:
    # Dibangun lokal dari Dockerfile + binary di repo ini.
    build:
      context: .
      dockerfile: Dockerfile
    image: iloveu/vpn-rest:latest
    container_name: vpn-api
    ports:
      - "3005:3005"
    environment:
      - PORT=3005
      - API_KEY=your_api_key_here
      - AllowOrigins=*
    restart: unless-stopped
